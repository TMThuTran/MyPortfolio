# Books on the Books page and the home page shelf.
# To add a book: copy one block, change the details, and keep the same indentation.
# The cover is found automatically from the ISBN-13 (the 13-digit number starting with 978).
# Optional: add "link: https://..." to a book to link its title to a page about it.

- title: Inspired
  subtitle: How to Create Tech Products Customers Love
  author: Marty Cagan
  isbn: "9781119387503"
  topic: Product management
  about: How strong product teams discover products worth building, by testing ideas for value, usability, feasibility and business viability before committing engineers to them.
  note: It taught me to separate discovery from delivery. Before building anything, I now ask which of those four risks is the biggest, and what the cheapest way to test it is.

- title: AI Engineering
  subtitle: Building Applications with Foundation Models
  author: Chip Huyen
  isbn: "9781098166304"
  topic: AI and machine learning
  about: A practical guide to building products on top of large language models, from prompting and retrieval to agents, fine-tuning and, above all, evaluation.
  note: The most useful book I've found for talking with engineers about AI on equal terms. The chapters on evaluation shaped how I approach my invoice-agent project.
