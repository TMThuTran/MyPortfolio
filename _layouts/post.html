---
layout: default
---
<div class="wrap">
  <header class="row page-head">
    <p class="margin"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %b %Y" }}</time></p>
    <div class="main">
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    </div>
  </header>
  {% if page.visual == 'recon' %}
  <div class="row">
    <div class="margin"></div>
    <div class="main">{% include hero-visual.html %}</div>
  </div>
  {% endif %}
</div>
<div class="wrap article">
  <div class="row">
    <div class="margin"></div>
    <div class="main prose">
      {{ content }}
      <p class="back"><a href="{{ '/writing/' | relative_url }}">All writing</a></p>
    </div>
  </div>
</div>
